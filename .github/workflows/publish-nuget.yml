name: Publish NuGet Package

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Todoist.slnx

      - name: Build
        run: dotnet build Todoist.slnx --configuration Release --no-restore

      - name: Resolve package version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pack NuGet package
        run: dotnet pack src/Todoist/Todoist.csproj --configuration Release --no-build -p:ContinuousIntegrationBuild=true -p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Publish package to NuGet.org
        run: dotnet nuget push src/Todoist/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
