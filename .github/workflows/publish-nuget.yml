name: Publish NuGet Package

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Todoist.slnx

      - name: Build
        run: dotnet build src/Todoist/Todoist.csproj --configuration Release --no-restore

      - name: Resolve package version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pack NuGet package
        run: dotnet pack src/Todoist/Todoist.csproj --configuration Release --no-build -p:ContinuousIntegrationBuild=true -p:PackageVersion=${{ env.PACKAGE_VERSION }} -o ./artifacts/packages

      - name: Publish package to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/packages/Todoist.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
